name: Build and Deploy German Truncate Completely

on:
  # (DISABLED) 1. Automatic: Trigger whenever you push to the 'german' branch
  # push:
  #  branches: ["german"]

  # 2. Manual: Adds a "Run workflow" button in the GitHub UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Optionally replace with hardcoded GitHub username lowercased (not mandatory with context reference)
  IMAGE_NAME_CLIENT: ghcr.io/${{ github.repository_owner }}/truncate-client
  IMAGE_NAME_CITADEL: ghcr.io/${{ github.repository_owner }}/truncate-citadel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Client
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: ${{ env.IMAGE_NAME_CLIENT }}:latest

      - name: Build and push Citadel
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.citadel
          push: true
          tags: ${{ env.IMAGE_NAME_CITADEL }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # This triggers the specific command we locked to the SSH key
            # No extra commands needed here because the server forces the deploy!
            true
